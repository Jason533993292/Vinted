<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Scraper Logs</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkBg: '#090a0f',
                        glassBg: 'rgba(17, 20, 32, 0.65)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        brandGreen: '#10b981',
                        brandRed: '#ef4444',
                        brandBlue: '#3b82f6',
                        accentPurp: '#6366f1',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090a0f;
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(17, 20, 32, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
        }
        .neon-glow-green {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 pb-6 border-b border-white/10">
            <div class="flex items-center gap-4">
                <a href="/" class="px-3 py-2 rounded-lg border border-white/10 hover:bg-white/5 transition-all text-xs font-semibold flex items-center gap-1.5 text-slate-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Back to Dashboard
                </a>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Real-Time Activity Logs</h1>
                    <p class="text-xs text-slate-400">Structured tabular log visualization of the active scraper process</p>
                </div>
            </div>

            <!-- Scraper Control Status -->
            <div class="glass-panel rounded-2xl px-5 py-3 flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span id="status-dot" class="w-3 h-3 rounded-full bg-slate-500 animate-pulse"></span>
                    <span id="status-text" class="text-sm font-semibold tracking-wide uppercase text-slate-400">Checking...</span>
                </div>
            </div>
        </header>

        <!-- Filters & Tools -->
        <div class="glass-panel rounded-2xl p-4 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-2">
                <span class="text-xs text-slate-400 self-center mr-2 font-medium">Filter Severity:</span>
                <button onclick="setFilter('ALL')" id="btn-ALL" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-500/25 border border-indigo-500/30 text-indigo-300">All Logs</button>
                <button onclick="setFilter('ACCEPT')" id="btn-ACCEPT" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-emerald-400 hover:bg-white/5">Accepts</button>
                <button onclick="setFilter('REJECT')" id="btn-REJECT" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-rose-400 hover:bg-white/5">Rejects</button>
                <button onclick="setFilter('CHECK')" id="btn-CHECK" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-indigo-400 hover:bg-white/5">Checks</button>
                <button onclick="setFilter('ERROR')" id="btn-ERROR" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-amber-500 hover:bg-white/5">Errors</button>
                <button onclick="setFilter('SKIP')" id="btn-SKIP" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:bg-white/5">Skips</button>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="text-xs text-slate-400" id="log-count">Showing 0 rows</span>
                <div class="h-4 w-px bg-white/10"></div>
                <button onclick="clearLogsLocal()" class="px-3 py-1.5 rounded-xl border border-white/10 hover:bg-white/5 text-xs font-semibold transition-all text-slate-300">
                    Clear View
                </button>
            </div>
        </div>

        <!-- Modern Table -->
        <div class="glass-panel rounded-2xl overflow-hidden border border-white/10">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-white/10 bg-white/[0.02] text-xs font-semibold tracking-wider text-slate-400 uppercase">
                            <th class="py-4 px-6 w-32">Timestamp</th>
                            <th class="py-4 px-6 w-36">Severity</th>
                            <th class="py-4 px-6">Log Message Detail</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y divide-white/5 text-sm text-slate-300 font-mono">
                        <tr>
                            <td colspan="3" class="py-12 text-center text-slate-500 font-sans font-medium">No activity log entries retrieved yet. Start the scraper to see logs.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let currentFilter = 'ALL';
        let rawLogText = '';
        let parsedLogs = [];

        // --- Fetch Scraper Status ---
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('status-text');

                if (data.status === 'running') {
                    dot.className = 'w-3 h-3 rounded-full bg-emerald-500 neon-glow-green animate-pulse';
                    text.innerText = 'Scraper Running';
                    text.className = 'text-sm font-semibold tracking-wide uppercase text-emerald-400';
                } else {
                    dot.className = 'w-3 h-3 rounded-full bg-slate-600';
                    text.innerText = 'Scraper Stopped';
                    text.className = 'text-sm font-semibold tracking-wide uppercase text-slate-400';
                }
            } catch (err) {
                console.error("Error fetching status:", err);
            }
        }

        // --- Log Parser ---
        function parseLogText(text) {
            const lines = text.split('\n');
            const entries = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                let severity = 'INFO';
                let message = line;
                
                // Categorize logs
                if (line.includes('✅ [ACCEPTED]')) {
                    severity = 'ACCEPT';
                    message = line.replace('✅ [ACCEPTED]', 'ACCEPTED:').trim();
                } else if (line.includes('❌ [REJECTED]')) {
                    severity = 'REJECT';
                    message = line.replace('❌ [REJECTED]', 'REJECTED:').trim();
                } else if (line.includes('⚠️ [API ERROR]') || line.includes('[ERROR]')) {
                    severity = 'ERROR';
                    message = line.replace('⚠️ [API ERROR]', '').replace('[ERROR]', '').trim();
                } else if (line.includes('[RATE LIMIT]')) {
                    severity = 'WARN';
                    message = line;
                } else if (line.includes('🔍 [CHECK]')) {
                    severity = 'CHECK';
                    message = line.replace('🔍 [CHECK]', 'CHECKING:').trim();
                } else if (line.includes('[SKIP]') || line.includes('[DUP SKIP]')) {
                    severity = 'SKIP';
                    message = line;
                } else if (line.startsWith('──') || line.startsWith('🚀')) {
                    severity = 'STAGE';
                    message = line;
                }

                // Fabricate timestamp from sequential lines (since standard logs lack timestamps on each line)
                const mockTime = new Date(Date.now() - (lines.length - i) * 100).toLocaleTimeString();
                
                entries.push({
                    timestamp: mockTime,
                    severity: severity,
                    message: message
                });
            }
            
            // Return reversed so latest are at the top
            return entries.reverse();
        }

        // --- Fetch Logs ---
        async function fetchLogs() {
            try {
                const res = await fetch('/api/scraper/logs');
                const data = await res.json();
                
                if (rawLogText !== data.logs) {
                    rawLogText = data.logs;
                    parsedLogs = parseLogText(data.logs);
                    renderLogTable();
                }
            } catch (err) {
                console.error("Error fetching logs:", err);
            }
        }

        // --- Render Log Table ---
        function renderLogTable() {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = '';
            
            const filtered = parsedLogs.filter(entry => {
                if (currentFilter === 'ALL') return true;
                return entry.severity === currentFilter;
            });
            
            document.getElementById('log-count').innerText = `Showing ${filtered.length} rows`;

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-12 text-center text-slate-500 font-sans font-medium">No logs matched the selected filter.</td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(entry => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-white/[0.02] transition-colors';
                
                let badgeClass = 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                if (entry.severity === 'ACCEPT') badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if (entry.severity === 'REJECT') badgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                if (entry.severity === 'CHECK') badgeClass = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
                if (entry.severity === 'ERROR') badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if (entry.severity === 'WARN') badgeClass = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
                if (entry.severity === 'STAGE') badgeClass = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                if (entry.severity === 'SKIP') badgeClass = 'bg-zinc-500/10 text-zinc-400 border-zinc-500/20';

                row.innerHTML = `
                    <td class="py-3.5 px-6 text-xs text-slate-500 font-medium">${entry.timestamp}</td>
                    <td class="py-3.5 px-6">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] uppercase font-bold border ${badgeClass}">
                            ${entry.severity}
                        </span>
                    </td>
                    <td class="py-3.5 px-6 text-slate-200">${entry.message}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // --- Set Filters ---
        function setFilter(filterType) {
            currentFilter = filterType;
            ['ALL', 'ACCEPT', 'REJECT', 'CHECK', 'ERROR', 'SKIP'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (f === filterType) {
                    btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all bg-indigo-500/25 border border-indigo-500/30 text-indigo-300';
                } else {
                    btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200';
                }
            });
            renderLogTable();
        }

        function clearLogsLocal() {
            parsedLogs = [];
            rawLogText = '';
            renderLogTable();
        }

        // --- Init ---
        window.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            fetchLogs();
            
            setInterval(checkStatus, 2000);
            setInterval(fetchLogs, 1500);
        });
    </script>
</body>
</html>
